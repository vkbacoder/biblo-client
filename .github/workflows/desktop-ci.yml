name: Desktop Client CI (Windows & macOS)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Test (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --dir apps/desktop typecheck

      - name: Frontend production build
        run: pnpm --dir apps/desktop build

      - name: Rust format check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Rust check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Tauri Windows installer build
        run: pnpm --dir apps/desktop tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finjulia-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Build & Test (macOS Universal & Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust stable with Apple Silicon and Intel targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --dir apps/desktop typecheck

      - name: Frontend production build
        run: pnpm --dir apps/desktop build

      - name: Rust check (Apple Silicon)
        working-directory: apps/desktop/src-tauri
        run: cargo check --target aarch64-apple-darwin

      - name: Rust check (Intel macOS)
        working-directory: apps/desktop/src-tauri
        run: cargo check --target x86_64-apple-darwin

      - name: Rust tests (Apple Silicon native runner)
        working-directory: apps/desktop/src-tauri
        run: cargo test --target aarch64-apple-darwin

      - name: Build macOS Apple Silicon bundle
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple Developer certificate found. Building signed Apple Silicon bundle..."
            pnpm --dir apps/desktop tauri build --target aarch64-apple-darwin
          else
            echo "No Apple Developer certificate found. Building unsigned Apple Silicon bundle (--no-sign)..."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            pnpm --dir apps/desktop tauri build --target aarch64-apple-darwin --no-sign
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS Intel bundle
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple Developer certificate found. Building signed Intel bundle..."
            pnpm --dir apps/desktop tauri build --target x86_64-apple-darwin
          else
            echo "No Apple Developer certificate found. Building unsigned Intel bundle (--no-sign)..."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            pnpm --dir apps/desktop tauri build --target x86_64-apple-darwin --no-sign
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS Universal bundle
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple Developer certificate found. Building signed Universal bundle..."
            pnpm --dir apps/desktop tauri build --target universal-apple-darwin
          else
            echo "No Apple Developer certificate found. Building unsigned Universal bundle (--no-sign)..."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            pnpm --dir apps/desktop tauri build --target universal-apple-darwin --no-sign
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify generated macOS DMGs
        run: |
          echo "=== Verifying Generated macOS DMGs on Disk ==="
          find apps/desktop/src-tauri/target -name "*.dmg" -ls

          AARCH64_DMG=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          X64_DMG=$(find apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          UNIVERSAL_DMG=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)

          if [ -z "$AARCH64_DMG" ]; then
            echo "::error::Apple Silicon DMG was not generated!"
            exit 1
          fi
          if [ -z "$X64_DMG" ]; then
            echo "::error::Intel DMG was not generated!"
            exit 1
          fi
          if [ -z "$UNIVERSAL_DMG" ]; then
            echo "::error::Universal DMG was not generated!"
            exit 1
          fi

          echo "Successfully verified all three DMGs exist on disk:"
          echo "  Apple Silicon DMG: $AARCH64_DMG"
          echo "  Intel DMG:         $X64_DMG"
          echo "  Universal DMG:     $UNIVERSAL_DMG"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finjulia-macos
          path: |
            apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/*/release/bundle/macos/*.app
          if-no-files-found: error
